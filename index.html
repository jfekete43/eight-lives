<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap');

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121213; color: #ffffff;
            margin: 0; padding: 20px; display: flex;
            flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Essential UI Layering */
        .game-wrapper { position: relative; z-index: 20; width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }

        .menu-btn {
            background-color: transparent; border: 3px solid white; color: white;
            padding: 20px; font-size: 18px; font-family: 'Press Start 2P', monospace;
            cursor: pointer; transition: 0.2s; border-radius: 8px; width: 100%;
            text-align: center; text-transform: uppercase; margin-bottom: 20px;
        }
        .menu-btn:hover { background-color: white; color: #121213; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 30; }
        .modal-content { background: #121213; margin: 15% auto; padding: 20px; border: 1px solid white; width: 80%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="game-wrapper" id="main-menu">
        <h1 style="font-family: 'Bungee', sans-serif;">THE GAME GRID</h1>
        <button class="menu-btn" onclick="console.log('Daily clicked'); startMode('daily')">DAILY RUN</button>
        <button class="menu-btn" onclick="console.log('Arcade clicked'); startMode('arcade')">ARCADE MODE</button>
        <button class="menu-btn" onclick="toggleModal(true)">STATS</button>
    </div>

    <div id="stats-modal" class="modal" onclick="toggleModal(false)">
        <div class="modal-content">
            <h2>STATS</h2>
            <p>If you see this, the modal works!</p>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            document.getElementById('stats-modal').style.display = show ? 'flex' : 'none';
        }
        
        function startMode(mode) {
            alert("Mode selected: " + mode);
            // This confirms if the buttons are triggering the function
        }
    </script>
</body>
</html>
