<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Grid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap');

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121213;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* CRT Effects */
        .crt-scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 9999; pointer-events: none;
            animation: scanlines 10s linear infinite;
        }
        .crt-vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            z-index: 9998; pointer-events: none;
        }
        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }

        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 600px; margin-bottom: 15px;
            position: relative; z-index: 10;
        }

        h1 { 
            margin: 0; flex: 2; text-align: center;
            font-family: 'Bungee', sans-serif; font-size: 32px; letter-spacing: 2px;
            color: #ffffff; text-shadow: 2px 2px 0px #e23636, -2px -2px 0px #538d4e;
            cursor: pointer;
        }
        
        .header-actions { flex: 1; display: flex; }
        .header-actions.left { justify-content: flex-start; }
        .header-actions.right { justify-content: flex-end; }

        .text-btn {
            background: transparent; border: none; color: #818384;
            font-size: 16px; font-weight: bold; cursor: pointer;
            letter-spacing: 1px; transition: color 0.2s; padding: 0;
        }
        .text-btn:hover { color: white; }

        /* MAIN MENU STYLES */
        #main-menu {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex-grow: 1; position: relative; z-index: 10;
            width: 100%; max-width: 600px; gap: 20px;
        }

        .menu-btn {
            background-color: transparent; border: 3px solid white; color: white;
            padding: 20px 40px; font-size: 20px; font-family: 'Press Start 2P', monospace;
            cursor: pointer; transition: 0.2s; border-radius: 8px; width: 100%;
            text-align: center; text-transform: uppercase;
        }
        .menu-btn:hover { background-color: white; color: #121213; }
        .menu-btn:disabled { border-color: #565758; color: #565758; cursor: not-allowed; background: transparent; }

        .score-display {
            font-family: 'Press Start 2P', monospace; font-size: 14px;
            text-align: center; color: #538d4e; margin-top: 10px; line-height: 1.5;
        }

        /* GAME UI (Hidden on load) */
        #game-ui {
            display: none; width: 100%; max-width: 600px;
            flex-direction: column; align-items: center; position: relative; z-index: 10;
        }

        /* Arcade Score Header */
        #arcade-score-header {
            display: none; width: 100%; justify-content: space-between;
            font-family: 'Press Start 2P', monospace; font-size: 12px;
            color: #538d4e; margin-bottom: 15px; border-bottom: 1px solid #3a3a3c; padding-bottom: 10px;
        }

        .instructions {
            background-color: #272729; border: 1px solid #3a3a3c; border-radius: 8px;
            padding: 15px 20px; margin-bottom: 20px; width: 100%; box-sizing: border-box; color: #d7dadc; font-size: 14px;
        }
        .instructions-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .instructions-header p { color: white; margin: 0; font-weight: bold; font-size: 16px; }
        .toggle-btn { background: transparent; border: none; color: #818384; font-size: 16px; font-weight: bold; cursor: pointer; }
        .instructions-content { margin-top: 15px; display: none; }
        .instructions ul { margin: 0; padding-left: 0; list-style-type: none; }
        .instructions li { margin-bottom: 8px; line-height: 1.4; }

        .lives-left { margin-bottom: 20px; font-size: 22px; letter-spacing: 4px; text-align: center; }

        .input-section { display: flex; gap: 10px; margin-bottom: 30px; width: 100%; box-sizing: border-box; }
        .autocomplete-container { position: relative; flex-grow: 1; }
        input { width: 100%; padding: 12px; font-size: 16px; background-color: #3a3a3c; color: white; border: 1px solid #565758; border-radius: 4px; box-sizing: border-box; }
        .suggestions-list { position: absolute; top: 100%; left: 0; width: 100%; background-color: #272729; border: 1px solid #565758; border-top: none; border-radius: 0 0 4px 4px; max-height: 250px; overflow-y: auto; z-index: 30; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .suggestion-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #3a3a3c; display: flex; flex-direction: column; text-align: left; }
        .suggestion-item:hover, .suggestion-item.active { background-color: #3a3a3c; }
        .suggestion-name { font-weight: bold; font-size: 15px; color: white; margin-bottom: 3px; }
        .suggestion-meta { font-size: 12px; color: #a0a0a0; }

        button.guess-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #538d4e; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button.guess-btn:hover { background-color: #43703e; }
        button:disabled { background-color: #3a3a3c; cursor: not-allowed; color: #818384; }
